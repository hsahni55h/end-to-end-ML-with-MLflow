# Paths are relative to this project's own directory (projects/01_wine_quality/),
# resolved against PROJECT_ROOT in pipeline.py — kept self-contained rather than
# sharing the repo-root artifacts/ used by the legacy src/mlProject pipeline.
artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_URL: https://github.com/hsahni55h/end-to-end-ML-with-MLflow/raw/main/winequality-data.zip
  local_data_file: data/raw/winequality-data.zip
  unzip_dir: artifacts/data_ingestion

data_validation:
  root_dir: artifacts/data_validation
  status_file: artifacts/data_validation/status.txt

data_transformation:
  root_dir: artifacts/data_transformation

model_trainer:
  root_dir: artifacts/model_trainer
  model_name: model.joblib

model_evaluation:
  root_dir: artifacts/model_evaluation
  metric_file_name: artifacts/model_evaluation/metrics.json

mlflow:
  experiment_name: wine_quality
